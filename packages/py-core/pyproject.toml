[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingserver-core"
version = "0.1.0"
description = "Shared Python utilities for Trading Server Ecosystem"
dependencies = [
    "redis>=5.0.0",
    "orjson>=3.9.0",
    "pydantic>=2.0.0",
    "python-json-logger>=2.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradingserver_core"]
