version: '3.8'

services:
  marketmaker-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketmaker-backend
    ports:
      - "9000:8001"
    volumes:
      - ./backend:/app
      - ./tests:/app/tests
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=fintech_redis
      - REDIS_PORT=6379
      - PORT=8001
      - ECN_HOST=ecngateway
      - ECN_PORT=9898
      - SENDER_COMP_ID=MARKETMAKER
      - TARGET_COMP_ID=ECNGATEWAY
    networks:
      - tradingserver-net
      - fintech_net

  marketmaker-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketmaker-ui
    ports:
      - "3002:3002"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_URL=http://marketmaker-backend:8001
      - BACKEND_WS_URL=ws://marketmaker-backend:8001
    depends_on:
      - marketmaker-backend
    networks:
      - tradingserver-net

networks:
  tradingserver-net:
    driver: bridge
  fintech_net:
    external: true
    name: infrastructure_fintech-net
