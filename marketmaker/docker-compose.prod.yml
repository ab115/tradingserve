version: '3.8'

services:
  marketmaker-backend:
    build:
      context: ../
      dockerfile: marketmaker/backend/Dockerfile
    container_name: marketmaker-backend
    ports:
      - "9000:8001"
    # volumes: removed for production (code baked in)
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=fintech_redis
      - REDIS_PORT=6379
      - PORT=8001
    networks:
      - tradingserver-net
      - fintech_net
    restart: always

  marketmaker-ui:
    build:
      context: ../
      dockerfile: marketmaker/frontend/Dockerfile
    container_name: marketmaker-ui
    ports:
      - "3002:3002"
    # volumes: removed for production (code baked in)
    environment:
      - BACKEND_URL=http://marketmaker-backend:8001
      - BACKEND_WS_URL=ws://marketmaker-backend:8001
      - VITE_API_URL=/marketmaker/api
      # VITE_WS_URL can be auto-detected or explicitly set if needed. 
      # api.ts logic handles relative WS if VITE_WS_URL is missing.
    depends_on:
      - marketmaker-backend
    networks:
      - tradingserver-net
      - fintech_net
    restart: always

networks:
  tradingserver-net:
    driver: bridge
  fintech_net:
    external: true
    name: tradingserver_backbone_net
