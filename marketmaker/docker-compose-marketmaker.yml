version: '3.8'

services:
  marketmaker-backend:
    build:
      context: ../
      dockerfile: marketmaker/backend/Dockerfile
    container_name: marketmaker-backend
    ports:
      - "9000:8001"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=fintech_redis
      - REDIS_PORT=6379
      - ECN_HOST=ecngateway
      - ECN_PORT=9898
      - PORT=8001
    networks:
      - tradingserver-net
      - fintech_net

  marketmaker-ui:
    build:
      context: ../
      dockerfile: marketmaker/frontend/Dockerfile
    container_name: marketmaker-ui
    ports:
      - "3002:3002"
    volumes:
      - ./frontend:/src/marketmaker/frontend
      - ../packages/ui-core:/src/packages/ui-core
      - /src/marketmaker/frontend/node_modules
    environment:
      - BACKEND_URL=http://marketmaker-backend:8001
      - BACKEND_WS_URL=ws://marketmaker-backend:8001
    depends_on:
      - marketmaker-backend
    networks:
      - tradingserver-net

networks:
  tradingserver-net:
    driver: bridge
  fintech_net:
    external: true
    name: tradingserver_backbone_net
