name: Bot CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Run Logic Test
      run: |
        python -c "from bot import strategy; assert strategy(99) == 'BUY'"
