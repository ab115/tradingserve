server {
    listen 80;
    absolute_redirect off;
    
    location = / {
        return 301 /demo/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /demo/index.html;
    }

    # Optional: Proxy API requests if we wanted to serve everything on one port
    # location /api/ {
    #     proxy_pass http://demo-backend:8001;
    # }
}
