version: '3.8'

services:
  ecn-fix-server:
    build:
      context: ../
      dockerfile: ecngateway/backend/Dockerfile
    container_name: ecngateway
    # ports:
    #   - "9898:9898" # Exposed via HAProxy
    environment:
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=fintech_redpanda:9092
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Keep data volumes for persistence, but remove code mounts if any
      - ./backend/log:/app/log
      - ./backend/store:/app/store
    networks:
      - default
      - fintech_net
    restart: always

  ecn-ui:
    build:
      context: ../
      dockerfile: ecngateway/ui/Dockerfile
    container_name: ecn-ui
    # volumes: removed for production
    ports:
      - "3005:80"
    networks:
      - default
      - fintech_net
    restart: always

  ecn-api:
    build: 
      context: ../
      dockerfile: ecngateway/backend/Dockerfile
    container_name: ecn-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8010:8000"
    environment:
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # volumes: removed for production
    networks:
      - default
      - fintech_net
    restart: always

networks:
  fintech_net:
    external: true
    name: tradingserver_backbone_net
