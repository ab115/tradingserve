version: '3.8'

services:
  ecn-fix-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecngateway
    ports:
      - "9898:9898"
    environment:
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=fintech_redpanda:9092
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Keep data volumes for persistence, but remove code mounts if any
      - ./backend/log:/app/log
      - ./backend/store:/app/store
    networks:
      - default
      - fintech_net
    restart: always

  ecn-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ecn-ui
    # volumes: removed for production
    ports:
      - "3005:3000"
    networks:
      - default
    restart: always

  ecn-api:
    build: ./backend
    container_name: ecn-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # volumes: removed for production
    networks:
      - default
    restart: always

networks:
  fintech_net:
    external: true
    name: infrastructure_fintech-net
