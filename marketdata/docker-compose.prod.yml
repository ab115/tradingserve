version: '3.8'

services:
  marketdata-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketdata-backend
    ports:
      - "9001:9001"
    # volumes: removed for production
    environment:
      - PYTHONUNBUFFERED=1
      - REDPANDA_BROKER=fintech_redpanda:9092
      - REDIS_HOST=fintech_redis
    networks:
      - tradingserver-net
      - fintech_net
    restart: always

  marketdata-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: marketdata-ui
    ports:
      - "3001:3001"
    # volumes: removed for production
    # Note: VITE_API_URL should likely be dynamic or set to the production domain
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - marketdata-backend
    networks:
      - tradingserver-net
    restart: always

  marketdata-proxy:
    image: nginx:alpine
    container_name: marketdata-proxy
    ports:
      - "3000:80"
    volumes:
      # Config still mounted. 
      # For true production, consider building a custom Nginx image with this config COPY'd.
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - marketdata-ui
      - marketdata-backend
    networks:
      - tradingserver-net
    restart: always

networks:
  tradingserver-net:
    driver: bridge
  fintech_net:
    external: true
    name: infrastructure_fintech-net
