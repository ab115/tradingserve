events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    server {
        listen 80;
        
        # Docker DNS Resolver (Required for dynamic resolution using variables)
        resolver 127.0.0.11 valid=30s;

        # Frontend (UI)
        location / {
            # Use variables to force runtime resolution (prevents startup crash if container not ready)
            set $ui_upstream http://marketdata-ui:3001;
            proxy_pass $ui_upstream;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend (API & WebSockets)
        location /ws/ {
            set $backend_upstream http://marketdata-backend:9001;
            # pass the request URI as-is (including /ws/ prefix)
            proxy_pass $backend_upstream;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        location /health {
            set $backend_upstream http://marketdata-backend:9001;
            proxy_pass $backend_upstream/health;
        }
    }
}
