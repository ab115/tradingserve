version: '3.8'

services:
  # ==========================================
  # INFRASTRUCTURE
  # ==========================================
  fintech_redis:
    image: redis:alpine
    container_name: fintech_redis
    ports:
      - "6379:6379"
    networks:
      - fintech_net
    restart: always

  fintech_redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.14
    container_name: fintech_redpanda
    ports:
      - "9092:9092"
      - "19092:19092"
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://fintech_redpanda:9092,external://localhost:19092
    networks:
      - fintech_net
    restart: always

  fintech_haproxy:
    image: haproxy:2.8
    container_name: fintech_haproxy
    ports:
      - "9898:9898" # FIX
      - "8404:8404" # Stats
    volumes:
      - ./infrastructure/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - fintech_net
    depends_on:
      - fintech_redis

  fintech_portal:
    image: nginx:alpine
    container_name: fintech_portal
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/landing:/usr/share/nginx/html:ro
    depends_on:
      - ecn-ui
      - exchange-ui
      - marketdata-ui
      - marketmaker-ui
    networks:
      - fintech_net
    restart: always

  # ==========================================
  # ECN GATEWAY
  # ==========================================
  ecn-fix-server:
    build:
      context: .
      dockerfile: ecngateway/backend/Dockerfile
      target: prod
    container_name: ecngateway
    environment:
      - REDIS_HOST=fintech_redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=fintech_redpanda:9092
    networks:
      - fintech_net
    command: ["python", "main.py"]
    restart: always

  ecn-api:
    build:
      context: .
      dockerfile: ecngateway/backend/Dockerfile
      target: prod
    container_name: ecn-api
    environment:
      - REDIS_HOST=fintech_redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=fintech_redpanda:9092
    ports:
      - "8000:8000"
    networks:
      - fintech_net
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: always

  ecn-ui:
    build:
      context: .
      dockerfile: ecngateway/ui/Dockerfile
      target: prod
    container_name: ecn-ui
    ports:
      - "3005:80"
    networks:
      - fintech_net
    restart: always

  # ==========================================
  # EXCHANGE
  # ==========================================
  exchange-engine:
    build:
      context: .
      dockerfile: exchange/backend/Dockerfile
      target: prod
    container_name: exchange
    environment:
      - REDIS_HOST=fintech_redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=fintech_redpanda:9092
      - KAFKA_TOPIC_EXECUTION_REPORTS=execution_reports
      - LOG_LEVEL=INFO
    networks:
      - fintech_net
    command: ["python", "main.py"]
    restart: always

  exchange-api:
    build:
      context: .
      dockerfile: exchange/backend/Dockerfile
      target: prod
    container_name: exchange-api
    environment:
      - REDIS_HOST=fintech_redis
      - REDIS_PORT=6379
    ports:
      - "8002:8002"
    networks:
      - fintech_net
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8002"]
    restart: always

  exchange-ui:
    build:
      context: .
      dockerfile: exchange/ui/Dockerfile
      target: prod
    container_name: exchange-ui
    ports:
      - "3003:80"
    networks:
      - fintech_net
    restart: always

  # ==========================================
  # MARKET DATA
  # ==========================================
  marketdata-backend:
    build:
      context: .
      dockerfile: marketdata/backend/Dockerfile
      target: prod
    container_name: marketdata-backend
    environment:
      - REDPANDA_BROKER=fintech_redpanda:9092
      - REDIS_HOST=fintech_redis
    ports:
      - "9001:9001"
    networks:
      - fintech_net
    restart: always

  marketdata-ui:
    build:
      context: .
      dockerfile: marketdata/ui/Dockerfile
      target: prod
    container_name: marketdata-ui
    ports:
      - "3001:80"
    networks:
      - fintech_net
    restart: always

  # ==========================================
  # MARKET MAKER
  # ==========================================
  marketmaker-backend:
    build:
      context: .
      dockerfile: marketmaker/backend/Dockerfile
      target: prod
    container_name: marketmaker-backend
    environment:
      - REDIS_HOST=fintech_redis
      - REDIS_PORT=6379
      - PORT=8001
    ports:
      - "9000:8001"
    networks:
      - fintech_net
    restart: always

  marketmaker-ui:
    build:
      context: .
      dockerfile: marketmaker/frontend/Dockerfile
      target: prod
    container_name: marketmaker-ui
    ports:
      - "3002:80"
    networks:
      - fintech_net
    restart: always

networks:
  fintech_net:
    name: tradingserver_backbone_net
    driver: bridge
