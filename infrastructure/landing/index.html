<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equity Trading Technology POD</title>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            width: 100%;
            padding: 2rem;
        }

        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #334155;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-color: #3b82f6;
        }

        h1 {
            margin-bottom: 3rem;
            font-size: 2.5rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
        }

        p {
            margin: 0;
            color: #94a3b8;
        }

        .icon {
            font-size: 2rem;
            margin-bottom: 1rem;
            display: block;
        }
    </style>
</head>

<body>
    <h1>Equity Trading Technology POD</h1>
    <div class="container" id="links">
        <!-- Links injected by JS -->
    </div>

    <script>
        // No longer need host/port logic. Links are RELATIVE path based.

        const services = [
            { path: "edulab.html", name: "EduLab Interactive", icon: "🚀", desc: "The Engineering Ladder (Interactive Labs)" },
            { path: "/marketdata/", name: "Market Data UI", icon: "📊", desc: "Real-time Data Feed" },
            { path: "/marketmaker/", name: "Market Maker UI", icon: "🏦", desc: "Liquidity Provider Dashboard" },
            { path: "/exchange/", name: "Exchange UI", icon: "🏛️", desc: "Main Trading Interface" },
            { path: "/ecn/", name: "ECN Gateway UI", icon: "🌐", desc: "External Venue Control" },
            // Infra tools might need direct port access or specific proxy config
            { path: "/redis/", name: "Redis Console", icon: "💾", desc: "Database Inspector (Direct Port 8081)" },
            { path: "/redpanda/", name: "Kafka Console", icon: "🐼", desc: "Event Stream Inspector (Direct Port 8080)" },

        ];

        const container = document.getElementById('links');

        services.forEach(s => {
            const a = document.createElement('a');
            a.href = s.path;
            a.className = 'card';
            a.target = '_blank'; // Open in new tab
            a.innerHTML = `
                <span class="icon">${s.icon}</span>
                <h2>${s.name}</h2>
                <p>${s.desc}</p>
            `;
            container.appendChild(a);
        });
    </script>
</body>

</html>
