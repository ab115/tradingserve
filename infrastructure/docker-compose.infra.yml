version: '3.8'

services:
  haproxy:
    image: haproxy:2.8
    container_name: fintech_haproxy
    ports:
      - "9898:9898" # FIX
      - "8404:8404" # Stats
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - fintech_net
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: fintech_redis
    ports:
      - "6379:6379"
    networks:
      - fintech_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Message Bus (Redpanda - Kafka Compatible) ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: fintech_redpanda
    command:
      - redpanda start
      - --smp 1 
      - --memory 1G 
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://fintech_redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092" # External access
      - "9644:9644"   # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - fintech_net

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: fintech_console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: fintech_redpanda:9092
      KAFKA_CONSOLE_SERVER_BASEPATH: /redpanda
      REDPANDA_CONSOLE_SERVER_BASEPATH: /redpanda
      KOWL_SERVER_BASEPATH: /redpanda
    depends_on:
      - redpanda
    networks:
      - fintech_net

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: fintech_redis_ui
    environment:
      - REDIS_HOSTS=local:fintech_redis:6379
      - URL_PREFIX=/redis
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - fintech_net

  nginx-portal:
    image: nginx:alpine
    container_name: fintech_portal
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./landing:/usr/share/nginx/html:ro
    networks:
      - fintech_net

volumes:
  redpanda-data:


networks:
  fintech_net:
    name: tradingserver_backbone_net
