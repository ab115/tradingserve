global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'ecn-api'
    static_configs:
      - targets: ['ecn-api:8000']

  - job_name: 'exchange-engine'
    static_configs:
      - targets: ['exchange:8002'] # Engine might need a separate HTTP server or reuse API if coupled

  - job_name: 'exchange-api'
    static_configs:
      - targets: ['exchange-api:8002']

  - job_name: 'market-maker'
    static_configs:
      - targets: ['marketmaker-backend:8001']
