events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Enable WebSocket upgrades
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    
    resolver 127.0.0.11 valid=10s ipv6=off; # Docker DNS

    server {
        listen 80;
        
        # Portal (Landing Page)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # EduLab Interactive Manual (Static File)
        location = /edulab.html {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # --- Exchange ---
        # UI
        location /exchange/ {
            set $upstream_exch_ui http://exchange-ui:80;
            proxy_pass $upstream_exch_ui; 
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
        # API (Rewrite /exchange/api/foo -> /foo)
        location /exchange/api/ {
            set $upstream_exch_api http://exchange-api:8002;
            rewrite ^/exchange/api/(.*) /$1 break;
            proxy_pass $upstream_exch_api$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        # WS (Rewrite /exchange/ws -> /ws)
        location /exchange/ws {
            set $upstream_exch_api http://exchange-api:8002;
            rewrite ^/exchange/ws /ws break;
            proxy_pass $upstream_exch_api$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # --- Market Maker ---
        # UI
        location /marketmaker/ {
            set $upstream_mm_ui http://marketmaker-ui:80;
            proxy_pass $upstream_mm_ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
        # API 
        location /marketmaker/api/ {
            set $upstream_mm_api http://marketmaker-backend:8001;
            rewrite ^/marketmaker/api/(.*) /$1 break;
            proxy_pass $upstream_mm_api$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        # WS
        location /marketmaker/ws {
            set $upstream_mm_api http://marketmaker-backend:8001;
            rewrite ^/marketmaker/ws /ws break;
            proxy_pass $upstream_mm_api$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # --- Market Data ---
        # UI
        location /marketdata/ {
            set $upstream_md_ui http://marketdata-ui:80;
            proxy_pass $upstream_md_ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
        # API
        location /marketdata/api/ {
            set $upstream_md_api http://marketdata-backend:9001;
            rewrite ^/marketdata/api/(.*) /$1 break;
            proxy_pass $upstream_md_api$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        # WS
        location /marketdata/ws/ {
            set $upstream_md_api http://marketdata-backend:9001;
            rewrite ^/marketdata/ws/(.*) /ws/$1 break;
            proxy_pass $upstream_md_api$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }


        # --- ECN Gateway ---
        # UI
        location /ecn/ {
            set $upstream_ecn_ui http://ecn-ui:80;
            proxy_pass $upstream_ecn_ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
        # API
        location /ecn/api/ {
            set $upstream_ecn_api http://ecn-api:8000;
            rewrite ^/ecn/api/(.*) /$1 break;
            proxy_pass $upstream_ecn_api$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        # WS
        # ECN App constructs /ecn/ws
        location /ecn/ws {
            set $upstream_ecn_api http://ecn-api:8000;
            rewrite ^/ecn/ws /ws break;
            proxy_pass $upstream_ecn_api$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # --- Student Demo ---
        location /demo/ {
            set $upstream_demo_ui http://demo_ui:80;
            rewrite ^/demo/(.*) /$1 break;
            proxy_pass $upstream_demo_ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # --- Infrastructure Consoles ---
        # Redirect missing trailing slash
        location = /redpanda { return 301 /redpanda/; }
        location = /redis { return 301 /redis/; }

        location /redpanda/ {
            set $upstream_console http://redpanda-console:8080;
            proxy_pass $upstream_console;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /redpanda;
        }

        location /redis/ {
            set $upstream_redis http://redis-commander:8081;
            proxy_pass $upstream_redis;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
