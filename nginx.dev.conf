events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Enable WebSocket upgrades
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    
    server {
        listen 80;
        
        # Portal (Landing Page) - Mapped to landing directory
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # --- Exchange ---
        # UI (Vite Dev Server on 3003)
        location /exchange/ {
            proxy_pass http://exchange-ui:3003; 
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
        # API 
        location /exchange/api/ {
            rewrite ^/exchange/api/(.*) /$1 break;
            proxy_pass http://exchange-api:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        # WS
        location /exchange/ws {
            rewrite ^/exchange/ws /ws break;
            proxy_pass http://exchange-api:8002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # --- Market Maker ---
        # UI (Vite Dev Server on 3002)
        location /marketmaker/ {
            proxy_pass http://marketmaker-ui:3002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
        # API 
        location /marketmaker/api/ {
            rewrite ^/marketmaker/api/(.*) /$1 break;
            proxy_pass http://marketmaker-backend:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        # WS
        location /marketmaker/ws {
            rewrite ^/marketmaker/ws /ws break;
            proxy_pass http://marketmaker-backend:8001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # --- Market Data ---
        # UI (Vite Dev Server on 3000)
        location /marketdata/ {
            proxy_pass http://marketdata-ui:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
        # API
        location /marketdata/api/ {
            rewrite ^/marketdata/api/(.*) /$1 break;
            proxy_pass http://marketdata-backend:9001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        # WS
        location /marketdata/ws/ {
            rewrite ^/marketdata/ws/(.*) /ws/$1 break;
            proxy_pass http://marketdata-backend:9001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # --- ECN Gateway ---
        # UI (Vite Dev Server on 3000)
        location /ecn/ {
            proxy_pass http://ecn-ui:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
        # API
        location /ecn/api/ {
            rewrite ^/ecn/api/(.*) /$1 break;
            proxy_pass http://ecn-api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        # WS
        location /ecn/ws {
            rewrite ^/ecn/ws /ws break;
            proxy_pass http://ecn-api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
    }
}
